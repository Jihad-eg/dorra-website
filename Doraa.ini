// صفحة تواصل معنا
export function Contact() {
  return (
    <main className="min-h-screen bg-black text-white font-sans p-6">
      <h1 className="text-4xl font-bold mb-8 text-center">تواصل معنا / Contact</h1>
      <div className="text-center mb-6">
        <p className="text-lg">لأي استفسارات أو لمزيد من المعلومات، يمكنك التواصل معنا عبر الوسائل التالية:</p>
      </div>
      <div className="flex flex-wrap justify-center gap-6">
        {/* Facebook */}
        <a href="#" target="_blank" className="flex items-center gap-2 text-white">
          <Facebook size={24} />
          <span>Facebook</span>
        </a>
        {/* Instagram */}
        <a href="#" target="_blank" className="flex items-center gap-2 text-white">
          <Instagram size={24} />
          <span>Instagram</span>
        </a>
        {/* WhatsApp */}
        <a href="#" target="_blank" className="flex items-center gap-2 text-white">
          <WhatsApp size={24} />
          <span>WhatsApp</span>
        </a>
      </div>
      <div className="mt-8 text-center">
        <Button className="bg-white text-black w-full sm:w-1/2 mx-auto">إرسال</Button>
      </div>
    </main>
  );
}
