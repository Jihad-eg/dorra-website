            <Card className="bg-white text-black rounded-2xl shadow-lg">
              <CardContent className="p-4">
                <img
                  src={`https://via.placeholder.com/300x300?text=خاتم+${item}`}
                  alt={`خاتم ${item}`}
                  className="rounded-xl mb-4"
