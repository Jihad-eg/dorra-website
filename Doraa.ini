import { Card, CardContent } from "@/components/ui/card";
import { Button } from "@/components/ui/button";
import { ShoppingCart, Phone, Info, Facebook, Instagram, WhatsApp } from "lucide-react";
import { motion } from "framer-motion";
import Link from "next/link";

// الصفحة الرئيسية
export default function Home() {
  return (
    <main className="min-h-screen bg-black text-white font-sans">
      {/* Header */}
      <header className="text-center py-10">
        <h1 className="text-5xl font-bold mb-4">دُرَّة | DORRA</h1>
        <p className="text-lg">اكسسوارات نسائية أنيقة تجمع بين الأناقة والبساطة</p>
        <nav className="mt-6 flex flex-wrap justify-center gap-4 text-sm">
          <Link href="/about">من نحن / About</Link>
          <Link href="/contact">تواصل معنا / Contact</Link>
          <Link href="/cart">السلة / Cart</Link>
          <Link href="/necklaces">سلاسل / Necklaces</Link>
          <Link href="/rings">خواتم / Rings</Link>
          <Link href="/bracelets">أسوار / Bracelets</Link>
        </nav>
      </header>

      {/* Featured Products */}
      <section className="grid grid-cols-1 md:grid-cols-3 gap-4 p-4">
        {[1, 2, 3].map((item) => (
          <motion.div whileHover={{ scale: 1.05 }} key={item}>
            <Card className="bg-white text-black rounded-2xl shadow-lg">
              <CardContent className="p-4">
                <img
                  src={`https://via.placeholder.com/300x300?text=منتج+${item}`}
                  alt={`منتج ${item}`}
                  className="rounded-xl mb-4"
                />
                <h2 className="text-xl font-semibold mb-2">منتج {item}</h2>
                <p className="mb-2">وصف مختصر للمنتج {item}</p>
                <Button className="w-full">أضف إلى السلة</Button>
              </CardContent>
            </Card>
          </motion.div>
        ))}
      </section>

      {/* Footer */}
      <footer className="bg-white text-black mt-10 p-4 flex flex-col md:flex-row justify-between items-center">
        <div className="flex gap-4 items-center">
          <Info size={20} /> <Link href="/about">من نحن</Link>
          <Phone size={20} /> <Link href="/contact">تواصل معنا</Link>
          <ShoppingCart size={20} /> <Link href="/cart">السلة</Link>
        </div>
        <p className="text-sm mt-2 md:mt-0">© 2025 دُرَّة Dorra. جميع الحقوق محفوظة.</p>
      </footer>
    </main>
  );
}

// صفحة سلاسل
export function Necklaces() {
  return (
    <main className="min-h-screen bg-black text-white font-sans p-6">
      <h1 className="text-4xl font-bold mb-8 text-center">سلاسل / Necklaces</h1>
      <section className="grid grid-cols-1 md:grid-cols-3 gap-6">
        {[1, 2, 3].map((item) => (
          <motion.div whileHover={{ scale: 1.05 }} key={item}>
            <Card className="bg-white text-black rounded-2xl shadow-lg">
              <CardContent className="p-4">
                <img
                  src={`https://via.placeholder.com/300x300?text=سلسلة+${item}`}
                  alt={`سلسلة ${item}`}
                  className="rounded-xl mb-4"
                />
                <h2 className="text-xl font-semibold mb-2">سلسلة {item}</h2>
                <p className="mb-2">تفاصيل بسيطة عن السلسلة {item}</p>
                <Button className="w-full">Add to Cart</Button>
              </CardContent>
            </Card>
          </motion.div>
        ))}
      </section>
    </main>
  );
}

